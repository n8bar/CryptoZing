; Production PHP settings (M20.2 §3.1)
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off
display_errors = Off
log_errors = On

; Code is baked into the image — never re-stat files.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
