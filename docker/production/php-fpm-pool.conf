; Production FPM pool sizing (M20.2 §2.3.3): worker cap held to what an
; invite-only alpha serves — 8 workers ≈ 720 MB worst case on a 4 GB box.
[www]
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; FPM ping endpoint for the container healthcheck.
ping.path = /fpm-ping

catch_workers_output = yes
decorate_workers_output = no
